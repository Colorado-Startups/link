name: scorecard

# OpenSSF Scorecard grades this repo's supply-chain practices, 0 to 10, and publishes the score to api.scorecard.dev,
# where the Quality page reads it (github.com/ossf/scorecard-action, read 2026-11-12). It runs on main only, never on a
# pull request, so no fork's code runs with id-token. A push runs it only when a file Scorecard grades changes.
on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "package.json"
      - "package-lock.json"
      - "SECURITY.md"
      - "LICENSE"
  schedule:
    - cron: "17 6 * * 1"
  branch_protection_rule:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
